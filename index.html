<style>
:root{--bg:#17191d;--panel:#24262b;--panel2:#303238;--line:#45474d;--muted:#a4a6ad;--text:#f7f7f8;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e0f11;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
#stage{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#292b30 0,#111214 68%);padding:0}
#phone{position:relative;width:min(100vw,calc(100dvh * 9 / 19.5));height:min(100dvh,calc(100vw * 19.5 / 9));aspect-ratio:9/19.5;background:#222;border:1px solid #555;border-radius:38px;overflow:hidden;box-shadow:0 20px 80px #000b;isolation:isolate}

#wallpaper{position:absolute;inset:0;background:#303238}

#dynamic-island{position:absolute;z-index:31;top:7px;left:50%;transform:translateX(-50%);width:86px;height:23px;border-radius:20px;background:#050505}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
#lockscreen{z-index:5;background:#303238}
#locktime{position:absolute;top:16%;width:100%;text-align:center;font-size:76px;letter-spacing:-3px;font-weight:250}
#lockdate{position:absolute;top:14%;width:100%;text-align:center;font-size:16px}
#lockhint{position:absolute;bottom:12%;width:100%;text-align:center;color:#ddd;font-size:13px}

#lockbottom{position:absolute;bottom:28px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}
.lockcircle{width:42px;height:42px;border-radius:50%;background:#3339;border:1px solid #ffffff55;display:grid;place-items:center;font-size:18px}

.key{height:58px;border:0;border-radius:50%;background:#ffffff20;color:white;font-size:25px;font-weight:300}
.key small{display:block;font-size:8px;letter-spacing:1px}
.key:active{background:#ffffff55}
#home{z-index:4;background:#303238;padding:58px 17px 30px}
#homepages{height:calc(100% - 100px);position:relative}
.homepage{display:none;height:100%;grid-template-columns:repeat(4,1fr);grid-auto-rows:88px;align-content:start;gap:3px 5px}
.homepage.active{display:grid}
.appicon{border:0;background:transparent;color:white;display:flex;align-items:center;flex-direction:column;gap:5px;padding:0;min-width:0}
.iconbox{width:53px;height:53px;border-radius:14px;display:grid;place-items:center;font-size:27px;font-weight:650;box-shadow:0 2px 5px #0003;position:relative;overflow:hidden;flex:none}.iconbox svg{width:100%;height:100%;display:block}.iconbox .wordmark{font-size:15px;font-weight:800;letter-spacing:-.7px}.iconbox.icon-calendar{font-size:10px}
.appicon span:last-child{font-size:10px;text-shadow:0 1px 3px #000;font-weight:450;white-space:nowrap}
.icon-kakao{background:#fee500;color:#291e00}.icon-ig{background:radial-gradient(circle at 30% 105%,#ffd776 0,#f56040 35%,#c13584 62%,#833ab4 85%,#405de6 100%);color:white}

#dock{position:absolute;bottom:15px;left:13px;right:13px;height:82px;border-radius:25px;background:#ffffff35;backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px}

#pagedots{position:absolute;bottom:107px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.pagedot{width:6px;height:6px;border-radius:50%;background:#ffffff70}.pagedot.on{background:#fff}
#appview{z-index:10;background:#f4f4f6;color:#171719;display:none}
#appview.active{display:block}
.appheader{height:62px;padding:29px 15px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;background:#f8f8fa;position:relative;z-index:2}
.appheader h2{font-size:17px;margin:0;font-weight:700}
.appheader button{border:0;background:transparent;color:#087cff;font-size:14px;padding:4px}

.appbody.dark{background:#080808;color:#f5f5f5}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px #0000000a}
.card.dark{background:#171719;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:#8b8b91}.small{font-size:12px}.tiny{font-size:10px}
.pill{display:inline-block;border-radius:99px;background:#e8f2ff;color:#087cff;padding:4px 8px;font-size:11px}
.item{padding:13px 2px;border-bottom:1px solid #e5e5e8}
.item:last-child{border:0}
.action{border:0;border-radius:10px;background:#087cff;color:#fff;padding:10px 13px;font-weight:600}
.action.secondary{background:#e9e9ed;color:#222}

.choice{width:100%;text-align:left;border:1px solid #ddd;background:white;color:#222;padding:12px;border-radius:12px;margin:5px 0}
#homebar{position:absolute;z-index:40;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:5px;background:#fff;opacity:.85;display:none}
#homebar.dark{background:#111}
#gesturelayer{position:absolute;z-index:35;bottom:0;left:0;right:0;height:20px}
#toast{position:absolute;z-index:80;bottom:40px;left:50%;transform:translateX(-50%);background:#222e;color:#fff;padding:9px 14px;border-radius:20px;font-size:12px;display:none;white-space:nowrap}
#overlay{position:absolute;inset:0;z-index:50;display:none;background:#0008;backdrop-filter:blur(12px);padding:42px 14px 20px;overflow:auto}
#overlay.show{display:block}
#overlay .sheet{background:#f4f4f6;color:#171719;border-radius:20px;padding:15px;max-height:100%;overflow:auto}
#overlay h3{margin:3px 0 12px}
#appfooter{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:4px;background:#111;z-index:4;pointer-events:none}
input[type=text]{border:1px solid #ccc;border-radius:9px;padding:10px;width:100%}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.photo{aspect-ratio:1;background:linear-gradient(135deg,#777,#34363b);display:flex;align-items:end;padding:6px;color:#fff;font-size:10px;text-shadow:0 1px 4px #000}
#appbody-content{min-height:100%}
@media(min-width:700px){#phone{border-radius:42px}}

/* KakaoTalk：獨立聊天列表與一對一／群組聊天室 */
#appbody:has(.kt-wrap){padding:0!important;overflow:hidden;background:#b7c8d8}
.kt-wrap{height:100%;display:flex;flex-direction:column;background:#f7f7f7;color:#222;overflow:hidden}
.kt-top{height:52px;flex:none;background:#fee500;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:18px;font-weight:750}
.kt-top-actions{display:flex;gap:18px;font-size:20px;font-weight:400}
.kt-search{margin:11px 14px 8px;padding:10px 13px;border-radius:9px;background:#f1f1f1;color:#999;font-size:13px}
.kt-list{flex:1;overflow:auto;background:#fff}
.kt-row{width:100%;display:flex;align-items:center;gap:11px;padding:12px 14px;border:0;border-bottom:1px solid #f0f0f0;background:#fff;text-align:left;color:#222;min-height:72px}
.kt-avatar{width:48px;height:48px;border-radius:18px;flex:none;background:linear-gradient(145deg,#d8dce2,#aeb7c2);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;position:relative;overflow:hidden}
.kt-avatar.group{background:#d9d2c8;color:#766d62}
.kt-row-main{min-width:0;flex:1}
.kt-row-title{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:650}
.kt-row-preview{font-size:12px;color:#999;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-row-right{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font-size:10px;color:#aaa;padding:2px 0}
.kt-unread{width:18px;height:18px;border-radius:50%;background:#f04d42;color:white;display:grid;place-items:center;font-size:10px}
.kt-tabs{height:54px;flex:none;background:#fafafa;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;color:#888;font-size:11px}
.kt-tabs span{display:flex;flex-direction:column;align-items:center;gap:3px}.kt-tabs b{font-size:19px;font-weight:500;color:#555}
.kt-room{height:100%;display:flex;flex-direction:column;background:#b7c8d8;color:#222;overflow:hidden}
.kt-roomhead{height:49px;flex:none;background:#b7c8d8;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #a9bac9}
.kt-roomhead button{background:transparent;color:#2875a8;font-size:15px;padding:5px}
.kt-roomtitle{font-size:16px;font-weight:700;text-align:center;flex:1}
.kt-roomtools{font-size:19px;color:#536b7e;min-width:48px;text-align:right}
.kt-messages{flex:1;min-height:0;overflow:auto;padding:9px 11px 14px;scroll-behavior:smooth}
.kt-day{text-align:center;color:#fff;background:#8299aa;border-radius:14px;font-size:10px;padding:5px 12px;width:max-content;margin:13px auto 17px}
.kt-msg{display:flex;gap:7px;margin:10px 0;align-items:flex-end}
.kt-msg.mine{justify-content:flex-end}
.kt-msg-avatar{width:30px;height:30px;flex:none;border-radius:50%;background:#eeeeef;border:1px solid #dedede;position:relative;overflow:hidden;display:block;color:transparent;font-size:0}
.kt-msg-avatar::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#c7c7c7;left:50%;top:5px;transform:translateX(-50%)}
.kt-msg-avatar::after{content:"";position:absolute;width:19px;height:14px;border-radius:12px 12px 5px 5px;background:#c7c7c7;left:50%;bottom:2px;transform:translateX(-50%)}
.kt-msg-content{max-width:77%;min-width:0}
.kt-sender{font-size:10px;color:#536879;margin:0 0 4px 2px}
.kt-bubbleline{display:flex;align-items:flex-end;gap:5px}
.kt-bubble{background:#fff;border-radius:4px 13px 13px 13px;padding:9px 11px;font-size:13px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #52697a12}
.kt-msg.mine .kt-bubble{background:#fee500;border-radius:13px 4px 13px 13px}
.kt-translation{border-top:1px solid #00000012;padding-top:5px;margin-top:5px;color:#777;font-size:11px;line-height:1.4}
.kt-time{font-size:9px;color:#60788a;white-space:nowrap;padding-bottom:2px}
.kt-compose{flex:none;background:#edf1f4;border-top:1px solid #a8b8c5;padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-height:38%;overflow:auto}
.kt-compose-label{font-size:10px;color:#718391;margin:0 0 5px 2px}
.kt-reply{width:100%;text-align:left;border:0;border-radius:10px;background:#fff6bd;color:#333;padding:8px 10px;margin:4px 0;font-size:12px;line-height:1.4}
.kt-reply .kt-translation{font-size:10px;margin-top:3px;padding-top:3px}
.kt-readonly{font-size:11px;color:#718391;text-align:center;padding:13px;background:#edf1f4}

</style>

function makeIcon(app){let d=APPS.find(a=>a[0]===app);return `<button class="appicon" data-app="${d[0]}" aria-label="${d[1]}"><i class="iconbox ${d[3]}">${iconArtwork(d[0])}</i><span>${d[1]}</span></button>`}
function buildHome(){el('page0').innerHTML=APPS.slice(0,12).map(a=>makeIcon(a[0])).join('');el('page1').innerHTML=APPS.slice(12,21).map(a=>makeIcon(a[0])).join('');el('dock').innerHTML=dockIds.map(makeIcon).join('');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));el(id).classList.add('active');el('homebar').style.display=id==='lockscreen'?'none':'block';el('homebar').classList.toggle('dark',id==='appview');}
function unlockStart(){el('unlock').classList.add('show');state.pass='';drawDots()}
function drawDots(){document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('filled',i<state.pass.length))}
function enterKey(k){if(k==='clear'){state.pass=''}else if(k==='del'){state.pass=state.pass.slice(0,-1)}else if(state.pass.length<4){state.pass+=k}
drawDots();if(state.pass.length===4){if(state.pass==='0801'){el('unlock').classList.remove('show');state.unlocked=true;showScreen('home');toast('已解鎖');save()}else{el('pass-error').textContent='密碼錯誤';setTimeout(()=>{state.pass='';drawDots();el('pass-error').textContent=''},700)}}}
function openApp(id){state.app=id;const a=APPS.find(x=>x[0]===id);el('apptitle').textContent=a?a[1]:id;el('appback').style.visibility='visible';showScreen('appview');renderApp(id);save()}
function closeApp(){state.app=null;showScreen('home')}
function header(title,body,opts={}){el('apptitle').textContent=title;el('appbody').style.padding='14px 14px 30px';el('appbody').classList.toggle('dark',!!opts.dark);el('appbody-content').innerHTML=body}

function calcPress(k){let v=state.calc;if(k==='AC'){state.calc='0';state.calcPrev=null;state.calcOp=null}else if(k==='±'){state.calc=String(-Number(v))}else if(k==='%'){state.calc=String(Number(v)/100)}else if(['+','−','×','÷'].includes(k)){state.calcPrev=Number(v);state.calcOp=k;state.calcNew=true}else if(k==='='){if(state.calcPrev!==null){let a=state.calcPrev,b=Number(v);state.calc=String(state.calcOp==='+'?a+b:state.calcOp==='−'?a-b:state.calcOp==='×'?a*b:a/b);state.calcPrev=null;state.calcOp=null;state.calcNew=true}}else if(k==='.'){if(!v.includes('.'))state.calc+='.'}else{state.calc=state.calcNew?k:v==='0'?k:v+k;state.calcNew=false}let d=el('calcdisplay');if(d)d.textContent=state.calc}

function addKoreanTranslations(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(node.parentElement && node.parentElement.closest('.kt-wrap'))return;
    const raw=node.nodeValue, key=raw.trim();
    if(!key || !/[가-힣]/.test(key) || !ZH_KO[key])return;
    if(node.parentElement && (node.parentElement.closest('.translation') || node.parentElement.dataset.translated==='1'))return;
    const frag=document.createDocumentFragment();
    const original=document.createElement('span');original.textContent=raw;original.dataset.translated='1';
    const zh=document.createElement('div');zh.className='translation';zh.textContent=ZH_KO[key];
    frag.append(original,zh);node.parentNode.replaceChild(frag,node);
  });
}
function detailPage(title, body, backFn){
  header(title,body);
  el('appback').onclick=backFn||(()=>renderApp(state.app));
  addKoreanTranslations(el('appbody-content'));
}
const baseRenderApp=renderApp;
renderApp=function(id){
  state.app=id;
  el('appback').onclick=closeApp;
  baseRenderApp(id);
  el('appback').onclick=closeApp;
  enhanceApp(id);
  addKoreanTranslations(el('appbody-content'));
};
function enhanceApp(id){
  const root=el('appbody-content');
  if(!root)return;
  root.querySelectorAll('.item').forEach((node,i)=>{
    if(node.dataset.detailBound)return;
    node.dataset.detailBound='1';node.style.cursor='pointer';
    node.addEventListener('click',e=>{
      e.stopPropagation();
      if(e.target.closest('button'))return;
      const text=node.innerText.trim();
      detailPage('詳細資訊',`<div class="card"><p style="white-space:pre-line">${escHtml(text)}</p><p class="muted small">此項目為手機內的唯讀紀錄。</p></div>`,()=>renderApp(id));
    });
  });
  root.querySelectorAll('.photo').forEach((node,i)=>{
    if(node.dataset.photoBound)return;node.dataset.photoBound='1';node.style.cursor='pointer';
    node.addEventListener('click',()=>detailPage('照片預覽',`<div class="photo" style="height:260px;aspect-ratio:auto;justify-content:center;align-items:center;font-size:16px">${escHtml(node.innerText)}<br><small>示意素材，非真實照片</small></div><p class="muted small">此版本尚未匯入實際照片素材。</p>`,()=>renderApp(id)));
  });
  if(['instagram','x','berriz','melon','game','taxi','notes','clock','translate','weather','settings','phone','messages'].includes(id)){
    root.querySelectorAll('.card').forEach((node,i)=>{
      if(node.dataset.detailBound || node.querySelector('button'))return;
      node.dataset.detailBound='1';node.style.cursor='pointer';
      node.addEventListener('click',e=>{
        if(e.target.closest('button'))return;
        detailPage('詳細紀錄',`<div class="card"><p style="white-space:pre-line">${escHtml(node.innerText.trim())}</p><p class="muted small">遊戲內瀏覽紀錄 · 唯讀</p></div>`,()=>renderApp(id));
      });
    });
  }
  if(id==='calendar' && !root.querySelector('[data-finish-day]')){
    const btn=document.createElement('button');btn.className='action';btn.dataset.finishDay='1';btn.style.width='100%';btn.style.margin='6px 0 14px';btn.textContent=state.day===9?'完成十日企劃／查看回顧':'完成今日行程 · 進入下一天';
    btn.addEventListener('click',()=>{finishDay();save();updateClock();});root.prepend(btn);
  }
  if(id==='phone' && !root.querySelector('[data-call-demo]')){
    const btn=document.createElement('button');btn.className='action';btn.dataset.callDemo='1';btn.style.width='100%';btn.textContent='模擬接收來電';
    btn.onclick=()=>incomingCall();root.prepend(btn);
  }
  if(id==='photos'){
    const note=document.createElement('div');note.className='card small';note.innerHTML='<b>相簿說明</b><p class="muted">目前為可點擊的照片分類佔位畫面；未匯入的照片不會假裝成真實公開照片。</p>';root.prepend(note);
  }
}
function escHtml(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ktAvatar(name,group=false){
  const initials={'성민이':'성','CRAVITY 단체방':'🪐','세림형':'世','런이형':'倫','정모형':'謨','우빈형':'彬','원진형':'進','민희형':'熙','형준형':'俊','매니저님':'M','168 dorm':'168'};
  return `<div class="kt-avatar ${group?'group':''}">${initials[name]||'•'}</div>`;
}
function ktIncomingAvatar(name){
  return `<div class="kt-msg-avatar" role="img" aria-label="${escHtml(name||'預設頭像')}"></div>`;
}
function renderKakaoList(){
  state.app='kakao';
  const replies=state.chatReplies||{};
  const rows=chatNames.map((name,i)=>{
    const data=chatData[name]||[];const last=(replies[name]||[]).slice(-1)[0]||data[data.length-1];
    const preview=last?(last.sender==='김태영'?'나: ':'')+last[2]: '새로운 대화';
    const time=last?last[0].split(' ').slice(-1)[0]:'';
    return `<button class="kt-row" onclick="openChat('${name.replace(/'/g,"\\'")}')">${ktAvatar(name,name.includes('단체')||name.includes('dorm'))}<span class="kt-row-main"><span class="kt-row-title">${escHtml(name)}${name==='성민이'?'<span style="color:#e7b900;font-size:12px">♥</span>':''}</span><span class="kt-row-preview">${escHtml(preview)}</span></span><span class="kt-row-right"><span>${escHtml(time)}</span>${i===0&&state.day===0?'<span class="kt-unread">1</span>':''}</span></button>`;
  }).join('');
  header('KakaoTalk',`<div class="kt-wrap"><div class="kt-top"><span>채팅</span><span class="kt-top-actions">⌕　＋　☰</span></div><div class="kt-search">⌕　搜尋聊天</div><div class="kt-list">${rows}</div><div class="kt-tabs"><span><b>●</b>朋友</span><span><b>▣</b>聊天</span><span><b>◉</b>開放聊天</span><span><b>◷</b>動態</span><span><b>⋯</b>更多</span></div></div>`);
  el('appbody').style.padding='0';
}
function openChat(name){
  state.selectedChat=name;state.chatReplies=state.chatReplies||{};
  const rows=[...(chatData[name]||[]),...(state.chatReplies[name]||[])];
  let lastDate='';
  const messages=rows.map(r=>{
    const date=(r[0]||'').split(' ')[0];let divider='';
    if(date!==lastDate){divider=`<div class="kt-day">${date.includes('/')?'2026年'+date.replace('/','月')+'日':date}</div>`;lastDate=date;}
    const mine=r[1]==='김태영';const zh=ZH_KO[r[2]]||'（中文翻譯暫缺）';
    return divider+`<div class="kt-msg ${mine?'mine':''}">${mine?'':ktIncomingAvatar(r[1]||name)}<div class="kt-msg-content">${!mine&&name.includes('단체')?`<div class="kt-sender">${escHtml(r[1])}</div>`:''}<div class="kt-bubbleline">${mine?`<span class="kt-time">${escHtml((r[0]||'').split(' ')[1]||'')}</span>`:''}<div class="kt-bubble">${escHtml(r[2])}<div class="kt-translation">${escHtml(zh)}</div></div>${mine?'':`<span class="kt-time">${escHtml((r[0]||'').split(' ')[1]||'')}</span>`}</div></div></div>`;
  }).join('');
  const options=[['알겠어 ㅋㅋ','知道啦ㅋㅋ'],['응 조금 있다가 봐!','嗯，等一下見！'],['지금은 조금 바빠. 나중에 연락할게.','我現在有點忙，晚點聯絡你。']];
  const controls=name==='매니저님'?'<div class="kt-readonly">工作聊天室 · 可瀏覽紀錄</div>':`<div class="kt-compose"><div class="kt-compose-label">選擇快速回覆 · 不開放自由輸入</div>${options.map((o,i)=>`<button class="kt-reply" onclick="replyChoice(${i})">${o[0]}<div class="kt-translation">${o[1]}</div></button>`).join('')}</div>`;
  header('KakaoTalk',`<div class="kt-room"><div class="kt-roomhead"><button onclick="renderKakaoList()">‹</button><div class="kt-roomtitle">${escHtml(name)}</div><div class="kt-roomtools">⌕　☰</div></div><div class="kt-messages" id="kt-messages">${messages||'<div class="kt-day">最近一週</div>'}</div>${controls}</div>`);
  el('appbody').style.padding='0';
  el('appback').onclick=()=>renderKakaoList();
  requestAnimationFrame(()=>{const box=el('kt-messages');if(box)box.scrollTop=box.scrollHeight;});
}

function watchVideo(name){detailPage('YouTube',`<div class="card"><div style="height:190px;background:#111;color:#fff;display:grid;place-items:center;font-size:42px">▶</div><b>${escHtml(name)}</b><p class="muted small">模擬播放畫面 · 僅觀看</p><button class="action secondary" onclick="renderApp('youtube')">返回首頁</button></div>`,()=>renderApp('youtube'));}
function mailDetail(i){
 const m=[['STARSHIP','11月行程確認','請確認本週工作行程。集合時間依照經紀人最新通知為準。'],['Manager','Re: 事前錄影集合時間','集合時間與交通安排已更新，請留意群組通知。'],['Brand Team','品牌合作邀請','希望邀請你參與本次企劃，詳細內容將由公司窗口統一確認。'],['Music Show','事前錄影注意事項','請依照工作人員通知完成報到，並留意現場動線。'],['Newsletter','CRAVITY weekly update','本週活動資訊整理。']][i];
 if(!m)return;detailPage('Mail',`<div class="card"><b>${escHtml(m[1])}</b><p class="muted small">${escHtml(m[0])}</p><hr><p>${escHtml(m[2])}</p><p class="muted tiny">此郵件為遊戲內模擬內容。</p></div>`,()=>renderApp('mail'));

function incomingCall(){
  const options=[['성민이','안 받아도 돼. 그냥 목소리 듣고 싶어서.','不用勉强接听。我只是想听听你的声音。'],['매니저님','태영아, 내일 이동 시간이 바뀌었어. 확인했지?','太荣，明天的移动时间改了。确认了吗？'],['알 수 없는 번호','여보세요?','喂？']];
  const item=options[state.calls.length%options.length];
  state.calls.push({name:item[0],time:timeStr(),accepted:false});save();
  el('overlay').classList.add('show');
  el('sheet').innerHTML=`<h3>來電 · ${escHtml(item[0])}</h3><p>${escHtml(item[1])}</p><div class="translation">${escHtml(item[2])}</div><p class="muted small">模擬來電，不會連接真實電話服務。</p><button class="action" onclick="answerCall()">接聽</button> <button class="action secondary" onclick="rejectCall()">拒接</button>`;
}
function answerCall(){closeOverlay();if(state.calls.length)state.calls[state.calls.length-1].accepted=true;save();toast('已接聽模擬來電');advance(3);}
function rejectCall(){closeOverlay();toast('已拒接來電');advance(1);}
function finishDay(){
  if(state.day<9){state.day++;state.minute=480;updateClock();save();toast('已進入 '+dates[state.day]);renderApp('calendar');}
  else{state.afterEnding=true;state.ending=true;save();header('十日回顧',`<div class="card"><h3>Afterglow · 十日回顧</h3><p>2026/11/02 – 2026/11/11</p><p>十天的行程、訊息與成員互動已整理完成。你可以繼續自由瀏覽手機，但不再推進時間或觸發新事件。</p><button class="action" onclick="closeApp()">自由瀏覽手機</button></div><div class="card"><b>重要紀錄</b>${state.events.map(x=>`<p class="small">${escHtml(x)}</p>`).join('')||'這次旅程留下了許多日常片段。'}</div>`);el('appback').onclick=closeApp;}
}
const baseOpenApp=openApp;
openApp=function(id){baseOpenApp(id);el('appback').onclick=closeApp;};
/* Ensure every app detail is translated after dynamic re-rendering. */
const appRoot=el('appbody-content');
if(appRoot){new MutationObserver(()=>addKoreanTranslations(appRoot)).observe(appRoot,{childList:true,subtree:true});}

</script>
