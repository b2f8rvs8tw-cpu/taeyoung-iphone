['Newsletter','CRAVITY weekly update','本週活動資訊整理。','10/30']
].map((m,i)=>`<div class="card" onclick="mailDetail(${i})"><b>${m[0]}</b><div>${m[1]}</div><p class="muted small">${m[2]}</p><span class="muted tiny">${m[3]}</span></div>`).join('');header('Mail',c);break;
case'game':c=`<div class="card"><b>已安裝的遊戲</b><p class="muted small">僅顯示遊戲資訊，不提供實際遊玩。</p></div>`+['모바일 리듬 게임','퍼즐 게임','전략 게임'].map(x=>appRow(x,'已安裝 · 最近遊玩紀錄','資訊')).join('');header('Game',c);break;
case'wallet':c=`<div class="card" style="background:linear-gradient(135deg,#202126,#050505);color:white;height:155px;border-radius:18px"><div class="row"><b>BLACK CARD</b><span>▰</span></div><div style="margin-top:48px;font-size:12px;letter-spacing:2px">••••　••••　••••　0801</div><div class="row small" style="margin-top:10px"><span>KIM TAEYOUNG</span><span>VISA</span></div></div><div class="card"><b>付款示範</b><p class="muted small">僅遊戲內模擬，不連接真實金融服務。</p><button class="action" onclick="walletPay()">模擬刷卡</button></div><div class="card"><b>票券與會員卡</b>${appRow('CRAVITY Membership','電子會員卡')}${appRow('演唱會電子票','票券資料')}</div><div class="card"><b>最近交易</b><div id="transactions">尚無交易</div></div>`;header('Wallet',c);break;
case'clock':c=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:44px">${timeStr()}</div><div class="muted">首爾 · 台北</div></div><div class="card"><b>鬧鐘</b>${appRow('07:30','每日','開啟')}${appRow('08:00','工作日','開啟')}${appRow('09:00','休息日','關閉')}</div>`;header('Clock',c);break;
case'translate':c=`<div class="card"><b>翻譯紀錄</b><p class="muted small">僅瀏覽既有紀錄</p></div>`+[
['오늘 일정 확인했어?','你確認今天的行程了嗎？','韓文 → 中文'],
['조심히 들어가.','回去路上小心。','韓文 → 中文'],
['잠깐 쉬었다가 연습하자.','休息一下再練習吧。','韓文 → 中文'],
['Are you ready for the schedule?','準備好今天的行程了嗎？','英文 → 中文']
].map(x=>`<div class="card"><b>${x[0]}</b><p>${x[1]}</p><span class="muted tiny">${x[2]}</span></div>`).join('');header('Translate',c);break;
case'food':c=`<div class="card"><b>배달의민족</b><p class="muted small">168 宿舍附近 · 模擬外送</p></div>`+['김치찌개 정식','치킨 세트','마라탕','불고기 덮밥','샌드위치 세트'].map((x,i)=>`<div class="card"><div class="row"><div><b>${x}</b><div class="muted small">₩${[11000,19000,15000,12000,9000][i].toLocaleString()}</div></div><button class="action" onclick="addMeal('${x}',${[11000,19000,15000,12000,9000][i]})">加入</button></div></div>`).join('')+`<div class="card"><b>購物車</b><div id="cart-list">${state.mealCart.map(x=>x.name).join('、')||'尚未選擇餐點'}</div><button class="action" onclick="checkout()">前往付款</button></div>`;header('Food Delivery',c);break;
case'taxi':c=`<div class="card"><b>叫車紀錄</b><p class="muted small">僅瀏覽，不可新增行程</p></div>`+appRow('11/01','168 宿舍 → STARSHIP','₩ 12,800')+appRow('10/31','STARSHIP → 錄音室','₩ 9,600')+appRow('10/30','電視台 → 168 宿舍','₩ 18,200');header('Taxi',c);break;
case'health':header('Health',`<div class="card"><b>無法開啟</b><p>此 App 已停用。</p></div>`);break;
case'notes':c=`<div class="card"><b>備忘錄</b><p class="muted small">僅瀏覽</p></div>`+appRow('買飲料','無糖冰美式')+appRow('練習室','記得帶護膝')+appRow('小想法','下次想試試新的攀岩館')+appRow('待辦','整理相簿、充電');header('Notes',c);break;
case'photos':c=`<div class="card"><b>照片 · 約 80 張</b><p class="muted small">公開照片素材尚未匯入；以下為分類預覽，不會冒充真實照片。</p></div><div class="photo-grid">${Array.from({length:30},(_,i)=>`<div class="photo" style="background:linear-gradient(${i*19}deg,#696b70,#282a30)">照片 ${i+1}<br><small>${['自拍','團體','練習','舞台','日常'][i%5]}</small></div>`).join('')}</div>`;header('Photos',c);break;
case'camera':header('Camera',`<div style="height:70%;background:linear-gradient(#35373c,#111);border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;flex-direction:column"><div style="font-size:38px">◉</div><p>相機預覽</p><span class="tiny">此介面僅供展示，無法拍攝或錄影</span></div>`);break;
case'calendar':c=`<div class="card"><b>2026年11月</b><p class="muted small">十天行程 · 唯讀</p></div>`+dates.map((d,i)=>`<div class="card"><b>${d}</b>${schedule[i].map((v,j)=>j%2===0?`<div class="item"><span class="pill">${v}</span> ${schedule[i][j+1]||''}</div>`:'').join('')}</div>`).join('');header('Calendar',c);break;
case'settings':c=`<div class="card"><b>김태영</b><p class="muted small">Apple ID · 唯讀示意</p></div>`+['飛航模式','Wi-Fi　已連線','藍牙　開啟','行動服務　LTE','通知','一般','顯示與亮度','電池　100%','隱私權與安全性'].map(x=>appRow(x,'查看設定（不可修改）','›')).join('');header('Settings',c);break;
case'phone':c=`<div class="card"><b>最近通話</b><p class="muted small">只可接聽來電，不可主動撥出</p></div>`+appRow('성민이','來電 · 已接聽','今天 07:12')+appRow('매니저님','來電 · 已接聽','昨天 21:30')+appRow('未知號碼','未接來電','昨天 02:14')+appRow('박세림','來電 · 已接聽','10/31');header('Phone',c);break;
case'messages':c=`<div class="card"><b>訊息</b><p class="muted small">可瀏覽、封鎖及檢舉；不可傳送或刪除</p></div>`+[['매니저님','내일 일정이 조금 변경됐어요.'],['未知號碼','왜 답장 안 해?'],['성민이','일어나면 연락해 ㅋㅋ'],['未知號碼','오늘도 회사 가는 거 맞지?']].map((x,i)=>`<div class="card"><b>${x[0]}</b><p>${x[1]}</p>${x[0]==='未知號碼'?`<button class="action secondary" onclick="blockNumber('${x[0]}')">封鎖</button> <button class="action secondary" onclick="toast('已檢舉')">檢舉</button>`:''}</div>`).join('');header('Messages',c);break;
case'calculator':c=`<div style="background:#111;color:white;border-radius:18px;padding:18px;margin-bottom:12px;text-align:right"><div style="font-size:42px;min-height:56px" id="calcdisplay">${state.calc}</div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].map(k=>`<button class="key" style="border-radius:50%;height:55px;background:${['÷','×','−','+','='].includes(k)?'#ff9f0a':['AC','±','%'].includes(k)?'#aaa':'#444'};color:${['AC','±','%'].includes(k)?'#111':'white'}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div>`;header('Calculator',c);break;
default:header(id,'<div class="card">此 App 尚無內容。</div>');
}
const panel=storyPanel(id);
if(panel) el('appbody-content').insertAdjacentHTML('beforeend',panel);
}
function openChat(name){state.selectedChat=name;let rows=chatData[name]||[];let html=`<div class="card"><b>${name}</b><p class="muted small">近一週聊天紀錄 · 唯讀瀏覽</p></div>`+rows.map(r=>`<div class="card"><div class="muted tiny">${r[0]}</div><b>${r[1]}</b><p>${r[2]}</p></div>`).join('')+`<div class="card"><b>需要回覆時</b><p class="muted small">選擇一個回覆，不開放自由輸入。</p><button class="choice" onclick="replyChoice('알겠어 ㅋㅋ')">알겠어 ㅋㅋ</button><button class="choice" onclick="replyChoice('응 조금 있다가 봐!')">응 조금 있다가 봐!</button><button class="choice" onclick="replyChoice('지금은 조금 바빠. 나중에 연락할게.')">지금은 조금 바빠. 나중에 연락할게.</button></div>`;header('KakaoTalk',html);el('appback').onclick=()=>renderApp('kakao')}
function replyChoice(t){toast('已選擇回覆：'+t);state.events.push('回覆 '+state.selectedChat+'：'+t);advance(5)}
function openBubble(which){let html=which==='tae'?`<div class="card"><b>김태영 · Bubble</b><p>오늘도 고생 많았어요! 밥 잘 챙겨 먹고 있죠? ㅎㅎ</p><span class="muted tiny">粉絲回覆（完整顯示）</span></div>`+['오늘 무대 최고였어요!','태영아 오늘도 수고했어 💙','밥 꼭 챙겨 먹기!','오늘 사진 더 보고 싶어요 ㅎㅎ'].map(x=>`<div class="card">${x}</div>`).join(''):`<div class="card"><b>안성민 · Bubble</b><p>오늘 날씨 괜찮더라. 다들 따뜻하게 입고 다녀요!</p><span class="muted tiny">太榮以一般訂閱者身分瀏覽</span></div><div class="card">오늘도 좋은 하루 보내요!</div>`;header('Bubble',html)}
function watchVideo(name){header('YouTube',`<div class="card"><div style="height:190px;background:#111;color:#fff;display:grid;place-items:center;font-size:42px">▶</div><b>${name}</b><p class="muted small">模擬播放畫面 · 僅觀看</p><button class="action secondary" onclick="renderApp('youtube')">返回首頁</button></div>`)}
function mailDetail(i){let m=[['STARSHIP','11月行程確認','請確認本週工作行程。集合時間依照經紀人最新通知為準。'],['Manager','Re: 事前錄影集合時間','集合時間與交通安排已更新，請留意群組通知。'],['Brand Team','品牌合作邀請','希望邀請你參與本次企劃，詳細內容將由公司窗口統一確認。'],['Music Show','事前錄影注意事項','請依照工作人員通知完成報到，並留意現場動線。'],['Newsletter','CRAVITY weekly update','本週活動資訊整理。']][i];header('Mail',`<div class="card"><b>${m[1]}</b><p class="muted small">${m[0]}</p><hr><p>${m[2]}</p><p class="muted tiny">此郵件為遊戲內模擬內容。</p></div>`)}
function walletPay(){el('overlay').classList.add('show');el('sheet').innerHTML=`<h3>確認付款</h3><p>模擬交易：₩ 35,000</p><p class="muted small">使用 BLACK CARD。這不會連接真實金融帳戶。</p><button class="action" onclick="confirmPay()">確認付款</button> <button class="action secondary" onclick="closeOverlay()">取消</button>`}
function confirmPay(){closeOverlay();let t=el('transactions');if(t)t.innerHTML='₩ 35,000 · 模擬消費 · '+dates[state.day];toast('遊戲內付款完成');state.events.push('黑卡模擬消費 ₩35,000');advance(3)}
function addMeal(name,price){state.mealCart.push({name,price});renderApp('food');toast('已加入購物車')}
function checkout(){if(!state.mealCart.length){toast('購物車是空的');return}let sum=state.mealCart.reduce((a,b)=>a+b.price,0);el('overlay').classList.add('show');el('sheet').innerHTML=`<h3>訂單確認</h3><p>${state.mealCart.map(x=>x.name).join('、')}</p><p>總計：₩ ${sum.toLocaleString()}</p><button class="action" onclick="completeOrder()">使用黑卡付款</button> <button class="action secondary" onclick="closeOverlay()">取消</button>`}
function completeOrder(){closeOverlay();state.events.push('外送訂單：'+state.mealCart.map(x=>x.name).join('、'));state.mealCart=[];toast('訂單已送出（模擬）');advance(15);renderApp('food')}
function blockNumber(n){state.blocked.push(n);toast('已封鎖未知號碼')}
function closeOverlay(){el('overlay').classList.remove('show')}
function advance(min){if(state.afterEnding)return;state.minute+=min;if(state.minute>=1440){state.minute-=1440;state.day=Math.min(9,state.day+1);if(state.day===9)state.ending=true;toast('日期已更新：'+dates[state.day])}updateClock();save()}
function finishDay(){if(state.day<9){state.minute=480;state.day++;updateClock();save();toast('已進入'+dates[state.day])}else{state.afterEnding=true;state.ending=true;header('十日回顧',`<div class="card"><h3>十日生活回顧</h3><p>2026/11/02 – 2026/11/11</p><p>這十天的行程、訊息、選擇與成員互動已整理完成。</p><p>你可以繼續自由瀏覽手機，但不再推進時間或觸發新事件。</p><button class="action" onclick="closeApp()">自由瀏覽手機</button></div><div class="card"><b>重要紀錄</b>${state.events.map(x=>`<p class="small">${x}</p>`).join('')||'這次旅程留下了許多日常片段。'}</div>`);}}
function calcPress(k){let v=state.calc;if(k==='AC'){state.calc='0';state.calcPrev=null;state.calcOp=null}else if(k==='±'){state.calc=String(-Number(v))}else if(k==='%'){state.calc=String(Number(v)/100)}else if(['+','−','×','÷'].includes(k)){state.calcPrev=Number(v);state.calcOp=k;state.calcNew=true}else if(k==='='){if(state.calcPrev!==null){let a=state.calcPrev,b=Number(v);state.calc=String(state.calcOp==='+'?a+b:state.calcOp==='−'?a-b:state.calcOp==='×'?a*b:a/b);state.calcPrev=null;state.calcOp=null;state.calcNew=true}}else if(k==='.'){if(!v.includes('.'))state.calc+='.'}else{state.calc=state.calcNew?k:v==='0'?k:v+k;state.calcNew=false}let d=el('calcdisplay');if(d)d.textContent=state.calc}
function swipeHome(){if(el('overlay').classList.contains('show')){closeOverlay();return}if(el('unlock').classList.contains('show'))return;if(el('appview').classList.contains('active')){closeApp();return}if(el('home').classList.contains('active')){closeApp();return}if(el('lockscreen').classList.contains('active')){unlockStart()}}
let touchStart=null;el('phone').addEventListener('touchstart',e=>{let t=e.touches[0];touchStart={x:t.clientX,y:t.clientY}}, {passive:true});el('phone').addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(touchStart.y>el('phone').clientHeight-35&&dy<-40){swipeHome()}else if(el('lockscreen').classList.contains('active')&&dy<-35){unlockStart()}else if(el('home').classList.contains('active')&&Math.abs(dx)>45){state.page=dx<0?1:0;el('page0').classList.toggle('active',state.page===0);el('page1').classList.toggle('active',state.page===1);document.querySelectorAll('.pagedot').forEach((d,i)=>d.classList.toggle('on',i===state.page))}touchStart=null},{passive:true});
el('lockscreen').addEventListener('click',()=>unlockStart());
el('keypad').addEventListener('click',e=>{let b=e.target.closest('button');if(b)enterKey(b.dataset.n)});
document.addEventListener('click',e=>{let b=e.target.closest('[data-app]');if(b)openApp(b.dataset.app)});
el('appback').onclick=closeApp;el('appmore').onclick=()=>toast('此 App 的其他功能依照設定限制');
el('gesturelayer').addEventListener('click',swipeHome);el('homebar').addEventListener('click',swipeHome);
el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeOverlay()});
buildHome();load();updateClock();
</script>
